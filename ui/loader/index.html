<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GTA Network — connecting</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="loader" class="loader">
  <div class="brand">GTA <span>Network</span></div>
  <div id="server" class="server">connecting…</div>
  <div class="row">
    <div id="spinner" class="spinner"></div>
    <div id="stage" class="stage">Connecting</div>
  </div>
  <div class="bar"><div id="bar" class="bar-fill"></div></div>
  <div id="detail" class="detail"></div>
  <div id="elapsed" class="elapsed"></div>
</main>
<script src="loader.js"></script>
</body>
</html>
