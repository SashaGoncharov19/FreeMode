name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub release with this tag from the selected branch (e.g. v0.1.0-alpha.1; a '-' makes it a pre-release). Leave empty to just build."
        required: false
        default: ""

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"

jobs:
  # ---------------------------------------------------------------------------------------------
  # Everything that does not need MSVC: the .NET 8 server, the cross-platform launcher, Map2Resource,
  # and a compile check of the whole in-game client stack against the managed SHVDN reference stub.
  # ---------------------------------------------------------------------------------------------
  linux:
    name: Linux (server, launcher, client compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        run: eng/version.sh >> "$GITHUB_ENV"

      - name: Build solution
        run: dotnet build GTANetwork.sln -c Release -p:GtanBuildNumber=$GTAN_BUILD -p:GtanRevision=$GTAN_REVISION

      - name: TypeScript typings (Tools/GTANetwork.TypeGen) must match the built APIs
        run: |
          refs="$(find ~/.nuget/packages/microsoft.netframework.referenceassemblies.net48 -type d -path '*/build/.NETFramework/v4.8' | head -1)"
          dotnet run --project Tools/GTANetwork.TypeGen -c Release -- \
            --client "$(ls Client/bin/Release/net*/GTANetwork.dll | head -1)" \
            --server "$(ls Server/bin/Release/net*/GTANetworkServer.dll | head -1)" \
            --net48-refs "$refs" --probe "$(dirname "$(ls Shv.NET/ref/bin/Release/net48/ScriptHookVDotNet.dll | head -1)")" --out types --runtime-lib runtime/gtan
          git diff --exit-code -- types/ runtime/gtan/api.generated.d.ts runtime/gtan/enums.generated.ts || { echo "types/ is stale: run Tools/GTANetwork.TypeGen (types/README.md) and commit the result"; exit 1; }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Type-check the TypeScript sample resource against the typings
        working-directory: samples/ts-resource
        run: |
          bun install --frozen-lockfile
          bun run check

      - name: Publish server and launcher
        run: |
          set -euo pipefail
          common=(-c Release -p:GtanBuildNumber=$GTAN_BUILD -p:GtanRevision=$GTAN_REVISION)
          # Linux builds are self-contained: nothing to install on the target machine (eng/setup-linux.sh relies on it).
          dotnet publish Server/GTANetworkServer.csproj "${common[@]}" -r linux-x64 --self-contained true  -o artifacts/server-linux-x64
          dotnet publish Server/GTANetworkServer.csproj "${common[@]}" -r win-x64   --self-contained false -o artifacts/server-win-x64
          dotnet publish Launcher/GTANetwork.Launcher.csproj "${common[@]}" -r linux-x64 --self-contained true  -p:PublishSingleFile=true -o artifacts/launcher-linux-x64
          dotnet publish Launcher/GTANetwork.Launcher.csproj "${common[@]}" -r win-x64   --self-contained false -p:PublishSingleFile=true -o artifacts/launcher-win-x64
          dotnet publish Launcher.Gui/GTANetwork.Launcher.Gui.csproj "${common[@]}" -r linux-x64 --self-contained true  -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/launcher-gui-linux-x64
          dotnet publish Launcher.Gui/GTANetwork.Launcher.Gui.csproj "${common[@]}" -r win-x64   --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/launcher-gui-win-x64
          # the window built without a display (Avalonia.Headless): the XAML loads, the status and the settings come up
          artifacts/launcher-gui-linux-x64/GTANetwork.Launcher.Gui --install-dir artifacts --self-test
          dotnet publish Map2Resource/Map2Resource.csproj "${common[@]}" -o artifacts/map2resource
          cp vehicleData.json artifacts/server-linux-x64/ && cp vehicleData.json artifacts/server-win-x64/

      - name: Smoke test the Linux server (Roslyn scripting, HTTP file server, SIGTERM)
        run: eng/smoke-test-server.sh artifacts/server-linux-x64

      - name: Integration test (headless bot joins the server over the real protocol)
        run: |
          set -euo pipefail
          dotnet publish Tools/GTANetwork.Bot/GTANetwork.Bot.csproj -c Release -p:GtanBuildNumber=$GTAN_BUILD -p:GtanRevision=$GTAN_REVISION -r linux-x64 --self-contained true  -p:PublishSingleFile=true -o artifacts/bot-linux-x64
          dotnet publish Tools/GTANetwork.Bot/GTANetwork.Bot.csproj -c Release -p:GtanBuildNumber=$GTAN_BUILD -p:GtanRevision=$GTAN_REVISION -r win-x64   --self-contained false -p:PublishSingleFile=true -o artifacts/bot-win-x64
          dotnet publish Tools/GTANetwork.Cli/GTANetwork.Cli.csproj -c Release -p:GtanBuildNumber=$GTAN_BUILD -p:GtanRevision=$GTAN_REVISION -r linux-x64 --self-contained true  -p:PublishSingleFile=true -o artifacts/cli-linux-x64
          dotnet publish Tools/GTANetwork.Cli/GTANetwork.Cli.csproj -c Release -p:GtanBuildNumber=$GTAN_BUILD -p:GtanRevision=$GTAN_REVISION -r win-x64   --self-contained false -p:PublishSingleFile=true -o artifacts/cli-win-x64
          eng/integration-test.sh artifacts/server-linux-x64 artifacts/bot-linux-x64/GTANetwork.Bot
          eng/integration-test-auth.sh artifacts/server-linux-x64 artifacts/bot-linux-x64/GTANetwork.Bot
          eng/integration-test-template.sh artifacts/server-linux-x64 artifacts/bot-linux-x64/GTANetwork.Bot artifacts/cli-linux-x64/gtanetwork
          dotnet publish Tools/GTANetwork.Master/GTANetwork.Master.csproj -c Release -p:GtanBuildNumber=$GTAN_BUILD -p:GtanRevision=$GTAN_REVISION -r linux-x64 --self-contained true -o artifacts/master-linux-x64
          eng/integration-test-master.sh artifacts/server-linux-x64 artifacts/master-linux-x64
          eng/integration-test-dlc.sh artifacts/server-linux-x64 artifacts/bot-linux-x64/GTANetwork.Bot artifacts/launcher-linux-x64/GTANetwork.Launcher
          eng/integration-test-anticheat.sh artifacts/server-linux-x64 artifacts/bot-linux-x64/GTANetwork.Bot

      - uses: actions/upload-artifact@v4
        with:
          name: gtanetwork-server-linux-x64-${{ env.GTAN_VERSION }}
          path: artifacts/server-linux-x64
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: gtanetwork-server-win-x64-${{ env.GTAN_VERSION }}
          path: artifacts/server-win-x64
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: gtanetwork-launcher-linux-x64-${{ env.GTAN_VERSION }}
          path: artifacts/launcher-linux-x64
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: gtanetwork-launcher-win-x64-${{ env.GTAN_VERSION }}
          path: artifacts/launcher-win-x64
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: gtanetwork-launcher-gui-linux-x64-${{ env.GTAN_VERSION }}
          path: artifacts/launcher-gui-linux-x64
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: gtanetwork-launcher-gui-win-x64-${{ env.GTAN_VERSION }}
          path: artifacts/launcher-gui-win-x64
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: map2resource-${{ env.GTAN_VERSION }}
          path: artifacts/map2resource
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: gtanetwork-bot-linux-x64-${{ env.GTAN_VERSION }}
          path: artifacts/bot-linux-x64
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: gtanetwork-bot-win-x64-${{ env.GTAN_VERSION }}
          path: artifacts/bot-win-x64
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: gtanetwork-cli-linux-x64-${{ env.GTAN_VERSION }}
          path: artifacts/cli-linux-x64
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: gtanetwork-cli-win-x64-${{ env.GTAN_VERSION }}
          path: artifacts/cli-win-x64
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: gtanetwork-master-linux-x64-${{ env.GTAN_VERSION }}
          path: artifacts/master-linux-x64
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # Windows: builds the real ScriptHookVDotNet (C++/CLI, needs MSVC + the ScriptHookV SDK), links the
  # in-game client against it, assembles the client package and the NSIS installer.
  # ---------------------------------------------------------------------------------------------
  windows:
    name: Windows (ScriptHookVDotNet, client package, installer)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Compute version
        shell: bash
        run: eng/version.sh >> "$GITHUB_ENV"

      - name: ScriptHookV SDK
        # dev-c.com blocks automated downloads (HTTP 406 from Mod_Security), so by default the build uses
        # the compatible declarations in Shv.NET/sdk-compat. Set the repository variable SHV_SDK_URL to a
        # reachable copy of ScriptHookV_SDK_1.0.617.1a.zip to use the official SDK instead.
        shell: pwsh
        env:
          SHV_SDK_URL: ${{ vars.SHV_SDK_URL }}
        run: |
          if ($env:SHV_SDK_URL) {
            try {
              Invoke-WebRequest -Uri $env:SHV_SDK_URL -OutFile sdk.zip -UseBasicParsing -Headers @{ Referer = "http://www.dev-c.com/gtav/scripthookv/"; "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" }
              Expand-Archive sdk.zip -DestinationPath sdk-tmp -Force
              $inc = Get-ChildItem sdk-tmp -Recurse -Directory -Filter inc | Select-Object -First 1
              $lib = Get-ChildItem sdk-tmp -Recurse -Directory -Filter lib | Select-Object -First 1
              if (-not $inc -or -not $lib) { throw "Unexpected SDK layout" }
              New-Item -ItemType Directory -Force Shv.NET/sdk/inc, Shv.NET/sdk/lib | Out-Null
              Copy-Item "$($inc.FullName)/*" Shv.NET/sdk/inc -Recurse -Force
              Copy-Item "$($lib.FullName)/*" Shv.NET/sdk/lib -Recurse -Force
              Write-Host "Using the official ScriptHookV SDK from SHV_SDK_URL"
            } catch {
              Write-Warning "Official SDK download failed ($_); falling back to Shv.NET/sdk-compat"
            }
          }
          if (-not (Test-Path Shv.NET/sdk/lib/ScriptHookV.lib)) {
            & Shv.NET/sdk-compat/install-compat-sdk.ps1
          }
          Get-ChildItem Shv.NET/sdk -Recurse -File | Select-Object -ExpandProperty FullName

      - name: Build ScriptHookVDotNet (C++/CLI)
        shell: pwsh
        run: |
          msbuild Shv.NET/ScriptHookVDotNet.sln /m /v:minimal /p:Configuration=Release /p:Platform=x64
          if (-not (Test-Path Shv.NET/bin/ScriptHookVDotNet.dll)) { throw "ScriptHookVDotNet.dll was not produced" }
          Get-Item Shv.NET/bin/ScriptHookVDotNet.dll | Select-Object FullName, Length

      - name: Build solution against the real ScriptHookVDotNet
        shell: pwsh
        run: |
          $real = dotnet msbuild Client/GTANetworkClient.csproj -getProperty:UseRealShvdn
          if ($real.Trim() -ne "true") { throw "Client is not linked against the real ScriptHookVDotNet (UseRealShvdn=$real)" }
          dotnet build GTANetwork.sln -c Release -p:GtanBuildNumber=$env:GTAN_BUILD -p:GtanRevision=$env:GTAN_REVISION

      - name: Publish cross-platform launcher (win-x64)
        shell: pwsh
        run: dotnet publish Launcher/GTANetwork.Launcher.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:GtanBuildNumber=$env:GTAN_BUILD -p:GtanRevision=$env:GTAN_REVISION -o artifacts/launcher-win-x64

      - name: Assemble client package
        shell: pwsh
        run: eng/package-client.ps1

      - name: Build NSIS installer
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress; $env:PATH += ";C:\Program Files (x86)\NSIS" }
          $src = (Resolve-Path artifacts/client).Path
          $out = Join-Path (Resolve-Path artifacts).Path "GTANSetup-$env:GTAN_VERSION.exe"
          Push-Location Setup   # makensis resolves License.txt relative to the working directory
          try { makensis /V2 "/DSOURCE_DIR=$src" "/DOUT_FILE=$out" Setup.nsi } finally { Pop-Location }
          Get-Item artifacts/GTANSetup-*.exe | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: gtanetwork-client-win64-${{ env.GTAN_VERSION }}
          path: artifacts/client
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: gtanetwork-installer-${{ env.GTAN_VERSION }}
          path: artifacts/GTANSetup-*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: scripthookvdotnet-${{ env.GTAN_VERSION }}
          path: Shv.NET/bin/ScriptHookVDotNet.dll
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # Tag a commit as vX.Y.Z to publish a GitHub release with everything attached.
  # ---------------------------------------------------------------------------------------------
  release:
    name: GitHub release
    # Tag pushes (vX.Y.Z) or a manual run with the release_tag input (the action creates the tag on this commit).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/checkout@v4
        with:
          path: src

      - name: Zip artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          cp src/eng/setup-linux.sh release/setup-linux.sh
          cd artifacts
          for d in */; do
            d="${d%/}"
            if ls "$d"/*.exe >/dev/null 2>&1 && [ "$(ls "$d" | wc -l)" = "1" ] && [[ "$d" == gtanetwork-installer-* ]]; then
              cp "$d"/*.exe ../release/
            else
              (cd "$d" && zip -qr "../../release/$d.zip" .)
            fi
          done
          ls -la ../release

      - name: Release notes from CHANGELOG.md
        # The section whose heading matches the tag (v0.1.0 -> "## [0.1.0]") becomes the release body;
        # a pre-release without its own section (v0.1.1-alpha.2) takes the section of its base version
        # ("## [0.1.1]"). The auto-generated commit list is appended by the release action.
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag || github.ref_name }}"
          version="${tag#v}"
          section() { awk -v v="$1" '/^## \[/ { inside = index($0, "## [" v "]") == 1 } inside { print }' src/CHANGELOG.md; }
          section "$version" > release-notes.md
          if [ ! -s release-notes.md ] && [ "${version%%-*}" != "$version" ]; then
            base="${version%%-*}"
            { echo "Pre-release of **$base**; the notes below are the running notes of that version."; echo; section "$base"; } > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $version; see the commit list below." > release-notes.md
          fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release/*
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
